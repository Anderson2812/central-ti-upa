    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function renderizarImagemCard(card) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const W = 1080;
      const H = 1080;
      canvas.width = W;
      canvas.height = H;

      // Fundo escuro elegante
      ctx.fillStyle = card.corFundo;
      ctx.fillRect(0, 0, W, H);

      // Barra superior de destaque
      ctx.fillStyle = card.corDestaque;
      ctx.fillRect(0, 0, W, 24);

      // Moldura interna suave
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, 50, W - 80, H - 100);

      // Tag da categoria
      ctx.fillStyle = card.corDestaque;
      ctx.fillRect(80, 80, 260, 48);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(card.categoria.toUpperCase(), 210, 112);

      // Título
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(card.titulo, 80, 200);

      // Linha decorativa
      ctx.fillStyle = card.corDestaque;
      ctx.fillRect(80, 230, 180, 6);

      // Chamada / Subtítulo
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 28px Arial, sans-serif';
      ctx.fillText(card.chamada, 80, 290);

      // Caixa da mensagem
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 2;
      ctx.fillRect(80, 340, W - 160, 560);
      ctx.strokeRect(80, 340, W - 160, 560);

      // Texto da mensagem
      ctx.fillStyle = '#f8fafc';
      ctx.font = '400 38px Arial, sans-serif';
      wrapText(ctx, card.mensagem, 120, 440, W - 240, 64);

      // Rodapé
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 24px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(card.rodape, W / 2, 980);

      return canvas.toDataURL('image/png');
    }

    function iniciar() {
      const galeria = document.getElementById('galeria');
      galeria.replaceChildren();

      const listaImagens = [];

      CARDS.forEach(card => {
        const item = document.createElement('div');
        item.className = 'item-card';

        const info = document.createElement('div');
        info.className = 'card-info';
        info.innerHTML = `
          <b>#${card.id} — ${card.titulo}</b>
          <span class="badge ${card.badge}">${card.categoria}</span>
        `;

        const dataUrl = renderizarImagemCard(card);
        listaImagens.push({ id: card.id, url: dataUrl });

        const img = document.createElement('img');
        img.className = 'preview-img';
        img.src = dataUrl;
        img.alt = card.titulo;

        const btn = document.createElement('a');
        btn.className = 'btn peq';
        btn.href = dataUrl;
        btn.download = `card-ti-upa-${card.id}-${card.categoria.toLowerCase()}.png`;
        btn.innerHTML = '⬇️ Baixar Imagem (PNG 1080x1080)';

        item.append(info, img, btn);
        galeria.append(item);
      });

      document.getElementById('btnBaixarTodos').addEventListener('click', () => {
        listaImagens.forEach((item, index) => {
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = item.url;
            a.download = `card-ti-upa-${item.id}.png`;
            a.click();
          }, index * 250);
        });
      });
    }
